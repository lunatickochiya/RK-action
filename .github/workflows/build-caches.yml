name: Build Caches

# 预编工具链并写入 actions/cache（参考 autoset 的 archive/Build-Caches.yml）：
#   1) clone 源码 → 配置机器/软件包 → 可选 SFE/kmod，与 build-rockchip-2512 完全一致；
#   2) lunatickochiya/cachewrtbuild（fork，支持 CACHEWRT_SAVE_ON_FAILURE）的 post 步骤把
#      staging_dir/host*、staging_dir/tool*、.ccache
#      存成 "<mixkey>-cache-openwrt-<工具链hash>"；
#   3) 固件构建（build-rockchip-2512）用同一个 mixkey（matrix.target）即可命中，
#      跳过 tools/toolchain 编译；cache-keepalive 会每 5 天触碰这些 key。
#
# compile 阶段：
#   - 固定编 tools + toolchain（这是缓存的主要收益）；
#   - CacheLinux=1 时顺带编内核、CachePKGS=1 时顺带编 package/libs/toolchain 与 mac80211，
#     目的主要是把 .ccache 预热（.ccache 也在缓存里）。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      MACH:
        description: 'Choose machine (缓存 key 只跟 target 有关，机型影响 .ccache 内容)'
        required: true
        default: 'ztl-joyrock'
        type: choice
        options:
        - 'ztl-joyrock'
        - 'ztl-lite'
        - 'tpm312'
        - 'mpc1917'
        - 'mpc1917_lite'
        - 'fmx1_pro'
        - 'shimeta_aiot3588a'

      SFE_BUILDIN:
        description: 'Build sfe'
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

      patch_repo:
        description: 'Patch options (json), 与 build-rockchip-2512 保持一致'
        required: true
        default: '{"BCM_FULLCONE": "1", "TRY_BBR_V3": "1", "TEST_KERNEL": "1", "Firewall_Allow_WAN": "0", "DOCKER_BUILDIN": "0", "ADD_eBPF": "0", "ADD_IB": "1", "ADD_SDK": "1", "ADD_ROOTFS": "0"}'

      config_repo:
        description: 'Cache options (json)：CacheLinux/CachePKGS 控制是否顺带编内核/常用包，CacheSave=false 表示保存缓存'
        required: true
        default: '{"Cache": "1", "CacheLinux": "1", "CachePKGS": "1", "CacheSave": "false", "UPLOAD_RELEASE": "0", "ALLKMOD": "1"}'
env:
  TZ: Asia/Shanghai
  OpenWrt_PATCH_FILE_DIR: openwrt-2512-rk
  KERNEL66_REPO_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    strategy:
      matrix:
        include:
        - rockchip: ztl-joyrock
        - rockchip: ztl-lite
        - rockchip: tpm312
        - rockchip: mpc1917
        - rockchip: mpc1917_lite
        - rockchip: fmx1_pro
        - rockchip: shimeta_aiot3588a

    steps:
      - name: 检查
        uses: actions/checkout@main

      - name: 生成矩阵配置
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.MACH }}" == "${{ matrix.rockchip }}" ]; then
            matrix={\"include\":[{\"target\":\"rockchip-iptables\"},{\"target\":\"rockchip-nftables\"}]}
          fi
          echo "Generated matrix: "$matrix""
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    runs-on: Ubuntu-24.04
    needs: prepare
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Cache ${{github.event.inputs.MACH}} tools+toolchain ${{ matrix.target }}
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{github.event.inputs.MACH}}
      OpenWrt_PATCH_FILE_DIR: openwrt-2512-rk
      SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN || 'true' }}
      # fork 的 cachewrtbuild 用这个作业级 env 驱动 post-if：编译失败也保存缓存
      CACHEWRT_SAVE_ON_FAILURE: 'true'

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 检查服务器配置
      run: |
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "磁盘详情:"
        df -Th

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x gen-sha256sum.sh core.sh diy-2512-rk.sh after_build.sh refineconfig.sh
        $GITHUB_WORKSPACE/core.sh init-pkg-env

    - name: 设置GITHUB_ENV
      id: env
      env:
        PATCH_JSON_INPUT: ${{ github.event.inputs.patch_repo }}
        CONFIG_JSON_INPUT: ${{ github.event.inputs.config_repo }}
      run: |
        echo ${{matrix.target}}
        $GITHUB_WORKSPACE/core.sh init-gh-env-2512-rk

    - name: 克隆源代码
      working-directory: /workdir
      id: clone
      env:
        GIT_TERMINAL_PROMPT: '0'
      run: |
        df -hT $PWD
        # token 走 HTTP Authorization 头（同 actions/checkout 的做法），失败再退回 REPO_URL 形式
        token_part="${REPO_URL#https://}"; token_part="${token_part%@*}"
        clone_url="https://${REPO_URL#*@}"
        echo "REPO_URL length: ${#REPO_URL} / token part length: ${#token_part} / job token length: ${#KERNEL66_REPO_TOKEN}"
        if [ -z "$KERNEL66_REPO_TOKEN" ]; then
          echo "::error ::KERNEL66_REPO_TOKEN 为空，请检查仓库 secret MY_SECRET_TOKEN"
          exit 1
        fi
        auth_header="AUTHORIZATION: Basic $(printf 'x-access-token:%s' "$KERNEL66_REPO_TOKEN" | base64 -w0)"
        if ! git -c "http.https://github.com/.extraheader=${auth_header}" \
            clone "$clone_url" -b "$REPO_BRANCH" openwrt --single-branch; then
          echo "::warning ::extraheader 方式克隆失败，改用 REPO_URL（内嵌 token）重试"
          rm -rf openwrt
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt --single-branch
        fi
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        git config --global user.email "LunaticKochiya@github.com"
        git config --global user.name "LunaticKochiya"
        sed -i \
          -e 's|https://git.openwrt.org/feed/packages.git;openwrt-25.12|https://github.com/openwrt/packages.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/project/luci.git;openwrt-25.12|https://github.com/openwrt/luci.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/routing.git;openwrt-25.12|https://github.com/openwrt/routing.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-25.12|https://github.com/openwrt/telephony.git;openwrt-25.12|' \
          feeds.conf.default
        sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 增加磁盘空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        $GITHUB_WORKSPACE/core.sh ln-openwrt

    - name: Patch 自定义
      id: patch
      run: |
        $GITHUB_WORKSPACE/core.sh init-openwrt-patch-2512-rk
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加 SFE
      if: env.SFE_INPUT_STATUS == 'true'
      id: sfe
      run: |
        $GITHUB_WORKSPACE/core.sh add-openwrt-sfe-2512-rk
        echo "status=success" >> $GITHUB_OUTPUT
        echo "SFE=_SFE" >> $GITHUB_ENV

    - name: 自定义安装包(优先于feeds)
      if: steps.clone.outputs.status == 'success'
      id: files
      run: |
        $GITHUB_WORKSPACE/core.sh add-openwrt-files-2512-rk
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 更新 & 安装 feeds
      if: steps.files.outputs.status == 'success'
      id: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        (cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-replace/luci/* feeds/luci/ && echo "luci-lib-docker Re-add")
        rm -rf feeds/luci.index
        (rm -rf feeds/packages/lang/golang && cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-packages-replace/* feeds/packages/ && echo "Golang Replaced")
        rm -rf feeds/packages.index
        grep -q -- '--ci false \\' feeds/packages/lang/rust/Makefile || sed -i '/x\.py \\/a \        --ci false \\' feeds/packages/lang/rust/Makefile
        ./scripts/feeds update luci packages
        ./scripts/feeds install -a
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义配置（修复feeds）
      if: steps.feeds.outputs.status == 'success'
      id: config
      run: |
        $GITHUB_WORKSPACE/core.sh fix-openwrt-feeds
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加kmod
      if: steps.config.outputs.status == 'success' && env.ALLKMOD == '1'
      id: config2
      run: |
        $GITHUB_WORKSPACE/core.sh add-openwrt-kmods
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 下载包文件
      if: steps.config.outputs.status == 'success'
      run: |
        cd openwrt
        make download -j$(nproc) || true
        find dl -size -1024c -exec rm -f {} \;

    - name: 缓存staging
      # fork（lunatickochiya/cachewrtbuild@save-on-failure）：靠作业级 env
      # CACHEWRT_SAVE_ON_FAILURE=true 驱动 post-if，编译失败也执行 post 保存，
      # 这样 tools/toolchain 编完后即使后面包编译/打包失败，缓存也不会白编。
      uses: lunatickochiya/cachewrtbuild@save-on-failure
      if: env.Cache == '1' && !cancelled()
      with:
        ccache: 'true'
        mixkey: ${{ matrix.target }}${{ env.eBPF }}
        prefix: ${{ github.workspace }}/openwrt
        skip_saving: ${{ env.CacheSave }}

    - name: 编译Caches
      id: compile
      working-directory: ./openwrt
      run: |
        echo -e "$(($(nproc)+1)) thread compile"
        make tools/compile -j$(($(nproc)+1)) || make -j1 V=s
        make toolchain/compile -j$(($(nproc)+1)) || make -j1 V=s
        if [ "${{ env.CacheLinux }}" = "1" ]; then
          make target/linux/compile -j$(($(nproc)+1)) || make -j1 V=s
        fi
        if [ "${{ env.CachePKGS }}" = "1" ]; then
          make package/libs/toolchain/compile -j$(($(nproc)+1)) || make -j1 V=s
          make package/kernel/mac80211/compile -j$(($(nproc)+1)) || make -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 缓存内容概览
      if: steps.compile.outputs.status == 'success' && !cancelled()
      working-directory: ./openwrt
      run: |
        echo "--- staging_dir ---"
        du -sh staging_dir/host* staging_dir/tool* 2>/dev/null || true
        echo "--- ccache ---"
        du -sh .ccache 2>/dev/null || true
        echo "（staging_dir/host*、staging_dir/tool*、.ccache 会在 job 结束时由 cachewrtbuild 保存）"
