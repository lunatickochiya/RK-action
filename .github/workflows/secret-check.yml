name: Secret Check

# 快速校验 MY_SECRET_TOKEN 能否拉私有源码仓库（build-rockchip-2512 / 2512-618 的克隆步骤依赖它）。
# 手动触发，约 1 分钟出结果，避免整轮构建跑到克隆步骤才发现 token 失效。
on:
  workflow_dispatch:

jobs:
  # 1) 直接用 secret 拉取（基准）
  check-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Check private repo access (direct)
        env:
          TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error ::MY_SECRET_TOKEN 未设置"
            exit 1
          fi
          echo "token length: ${#TOKEN}"
          for branch in openwrt-25.12-6.6-rk openwrt-25.12-6.18-rk; do
            if GIT_TERMINAL_PROMPT=0 git ls-remote \
                "https://${TOKEN}@github.com/lunatickochiya/openwrt-ipq-2410.git" \
                "refs/heads/${branch}"; then
              echo "::notice ::direct: MY_SECRET_TOKEN 可用（${branch}）"
            else
              echo "::error ::direct: MY_SECRET_TOKEN 无法读取私有仓库（${branch}）"
              exit 1
            fi
          done

  # 2) 复刻构建流程：env 文件展开 ${KERNEL66_REPO_TOKEN} → GITHUB_ENV → 下一步 clone
  check-env-roundtrip:
    runs-on: ubuntu-latest
    env:
      KERNEL66_REPO_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
    steps:
      - name: Checkout (for env/openwrt-2512-rk.repo)
        uses: actions/checkout@main

      - name: Export env like core.sh init-gh-env-2512-rk
        run: |
          source "$GITHUB_WORKSPACE/env/openwrt-2512-rk.repo"
          echo "REPO_BRANCH=${REPO_BRANCH}" >> "$GITHUB_ENV"
          echo "REPO_URL=${REPO_URL}" >> "$GITHUB_ENV"
          token_part="${REPO_URL#https://}"
          token_part="${token_part%@*}"
          echo "REPO_URL length: ${#REPO_URL}"
          echo "token part length: ${#token_part}"

      - name: Clone like the build workflow
        working-directory: /tmp
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -x
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt --single-branch
          ls -la openwrt | head -5

  # 3) 6.18 画像的 env 文件同样走一遍
  check-env-roundtrip-618:
    runs-on: ubuntu-latest
    env:
      KERNEL66_REPO_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
    steps:
      - name: Checkout (for env/openwrt-2512-618-rk.repo)
        uses: actions/checkout@main

      - name: Export env like core.sh init-gh-env-2512-rk
        run: |
          source "$GITHUB_WORKSPACE/env/openwrt-2512-618-rk.repo"
          echo "REPO_BRANCH=${REPO_BRANCH}" >> "$GITHUB_ENV"
          echo "REPO_URL=${REPO_URL}" >> "$GITHUB_ENV"
          token_part="${REPO_URL#https://}"
          token_part="${token_part%@*}"
          echo "REPO_URL length: ${#REPO_URL}"
          echo "token part length: ${#token_part}"

      - name: Clone like the build workflow
        working-directory: /tmp
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -x
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt-618 --single-branch
          ls -la openwrt-618 | head -5
