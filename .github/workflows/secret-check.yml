name: Secret Check

# 快速校验 MY_SECRET_TOKEN 能否拉私有源码仓库（build-rockchip-2512 的克隆步骤依赖它）。
# 手动触发，约 1 分钟出结果，避免整轮构建跑到克隆步骤才发现 token 失效。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check private repo access
        env:
          TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error ::MY_SECRET_TOKEN 未设置"
            exit 1
          fi
          echo "token length: ${#TOKEN}"
          if GIT_TERMINAL_PROMPT=0 git ls-remote \
              "https://${TOKEN}@github.com/lunatickochiya/openwrt-ipq-2410.git" \
              "refs/heads/openwrt-25.12-6.6-rk"; then
            echo "::notice ::MY_SECRET_TOKEN 可用，能读取 openwrt-25.12-6.6-rk"
          else
            echo "::error ::MY_SECRET_TOKEN 无法读取私有仓库（token 失效或权限不足），请更新仓库 secret"
            exit 1
          fi
