name: Build Toolchain Cache (Rockchip)

# 只编译 tools + toolchain，并把结果同时放进：
#   1) Actions 缓存（cachewrtbuild，key 里带 tools/toolchain 的 git hash）
#   2) Release `toolchain-cache` 的 asset：toolchain-<画像>[_eBPF]-<hash>.tar.zst
# build-rockchip-2512*.yml 在编译固件前会先恢复工具链（缓存优先、Release 兜底），
# 省掉每次从零编 gcc/binutils/musl + host tools 的 40~70 分钟。
#
# 用法：
#   - 只在 Actions 里手动触发（Run workflow），选内核画像
#     （openwrt-2512-618-rk / openwrt-2512-rk），不会自动运行
#   - eBPF 开关要和固件构建时的 ADD_eBPF 一致：开 eBPF 时会多编 host bpftool，
#     所以 eBPF / 非 eBPF 各存一份缓存与 asset

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      patch_dir:
        description: '内核画像（决定源码分支）'
        required: true
        default: 'openwrt-2512-618-rk'
        type: choice
        options:
        - 'openwrt-2512-618-rk'
        - 'openwrt-2512-rk'
      machine:
        description: '用哪个机型生成 .config（同 target 的机型工具链相同）'
        required: true
        default: 'ztl-joyrock'
        type: choice
        options:
        - 'ztl-joyrock'
        - 'ztl-lite'
        - 'mpc1917'
        - 'mpc1917_lite'
        - 'fmx1_pro'
        - 'shimeta_aiot3588a'
        - 'shimeta_aiot3588a_lite'
      ebpf:
        description: '是否启用 eBPF（需和固件构建的 ADD_eBPF 一致；eBPF 多编 host bpftool）'
        required: true
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'
      panfrost:
        description: '顺带编译 libmesa-panfrost（llvm/mesa）并把 ccache 存进工具链缓存'
        required: true
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

env:
  TZ: Asia/Shanghai
  KERNEL66_REPO_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    name: Toolchain ${{ github.event.inputs.patch_dir }}${{ github.event.inputs.ebpf == 'true' && ' (eBPF)' || '' }}
    env:
      OpenWrt_PATCH_FILE_DIR: ${{ github.event.inputs.patch_dir }}
      Matrix_Target: rockchip-nftables
      Target_CFG_Machine: ${{ github.event.inputs.machine || 'ztl-joyrock' }}
      SFE_INPUT_STATUS: 'false'
      PANFROST: ${{ github.event.inputs.panfrost || 'false' }}

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x gen-sha256sum.sh core.sh diy-2512-rk.sh after_build.sh refineconfig.sh
        $GITHUB_WORKSPACE/core.sh init-pkg-env

    - name: 设置GITHUB_ENV
      id: env
      env:
        PATCH_JSON_INPUT: '{"BCM_FULLCONE": "0", "TRY_BBR_V3": "0", "TEST_KERNEL": "0", "ADD_eBPF": "0"}'
        CONFIG_JSON_INPUT: '{"Cache": "0", "CacheSave": "false", "CacheSaveOnFailure": "true", "UPLOAD_RELEASE": "0", "ALLKMOD": "0"}'
        INPUT_EBPF: ${{ github.event.inputs.ebpf }}
      run: |
        if [ "$INPUT_EBPF" = "true" ]; then
          PATCH_JSON_INPUT=$(echo "$PATCH_JSON_INPUT" | jq '.ADD_eBPF="1"')
          export PATCH_JSON_INPUT
          echo "eBPF enabled: $PATCH_JSON_INPUT"
        fi
        $GITHUB_WORKSPACE/core.sh init-gh-env-2512-rk

    - name: 克隆源代码
      working-directory: /workdir
      id: clone
      env:
        GIT_TERMINAL_PROMPT: '0'
      run: |
        df -hT $PWD
        # token 走 HTTP Authorization 头（同 actions/checkout 的做法；对 git 版本/重定向更稳），
        # 失败再退回 env 文件里的 REPO_URL（URL 内嵌 token）形式。
        token_part="${REPO_URL#https://}"; token_part="${token_part%@*}"
        clone_url="https://${REPO_URL#*@}"
        echo "REPO_URL length: ${#REPO_URL} / token part length: ${#token_part} / job token length: ${#KERNEL66_REPO_TOKEN}"
        echo "REPO_URL sha256: $(printf '%s' "$REPO_URL" | sha256sum | cut -d' ' -f1)"
        if [ -z "$KERNEL66_REPO_TOKEN" ]; then
          echo "::error ::KERNEL66_REPO_TOKEN 为空，请检查仓库 secret MY_SECRET_TOKEN"
          exit 1
        fi
        auth_header="AUTHORIZATION: Basic $(printf 'x-access-token:%s' "$KERNEL66_REPO_TOKEN" | base64 -w0)"
        if ! git -c "http.https://github.com/.extraheader=${auth_header}" \
            clone "$clone_url" -b "$REPO_BRANCH" openwrt --single-branch; then
          echo "::warning ::extraheader 方式克隆失败，改用 REPO_URL（内嵌 token）重试"
          rm -rf openwrt
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt --single-branch
        fi
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        git config --global user.email "LunaticKochiya@github.com"
        git config --global user.name "LunaticKochiya"
        sed -i \
          -e 's|https://git.openwrt.org/feed/packages.git;openwrt-25.12|https://github.com/openwrt/packages.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/project/luci.git;openwrt-25.12|https://github.com/openwrt/luci.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/routing.git;openwrt-25.12|https://github.com/openwrt/routing.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-25.12|https://github.com/openwrt/telephony.git;openwrt-25.12|' \
          feeds.conf.default
        sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
        sed -i '$a src-git node https://github.com/nxhack/openwrt-node-packages.git;openwrt-25.12' feeds.conf.default
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Patch 自定义
      id: patch
      run: |
        $GITHUB_WORKSPACE/core.sh init-openwrt-patch-2512-rk
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义安装包(优先于feeds)
      id: files
      run: |
        $GITHUB_WORKSPACE/core.sh add-openwrt-files-2512-rk
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 更新 & 安装 feeds
      id: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        (cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-replace/luci/* feeds/luci/ && echo "luci-lib-docker Re-add")
        rm -rf feeds/luci.index
        (rm -rf feeds/packages/lang/golang && cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-packages-replace/* feeds/packages/ && echo "Golang Replaced")
        rm -rf feeds/packages.index
        grep -q -- '--ci false \\' feeds/packages/lang/rust/Makefile || sed -i '/x\.py \\/a \        --ci false \\' feeds/packages/lang/rust/Makefile
        ./scripts/feeds update luci packages
        ./scripts/feeds update node
        rm -rf ./package/feeds/packages/node ./package/feeds/packages/node-*
        ./scripts/feeds install -a -p node
        ./scripts/feeds install -a
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义配置（修复feeds）
      id: config
      run: |
        $GITHUB_WORKSPACE/core.sh fix-openwrt-feeds
        cd openwrt
        rm -rf feeds/telephony.index
        ./scripts/feeds update telephony
        ./scripts/feeds install -a
        cd ../

    - name: 编译 tools + toolchain
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread toolchain compile"
        make -j$(nproc) tools/install toolchain/install

    - name: 预热 libmesa-panfrost（llvm/mesa）
      # 只保留 target/device + libmesa-panfrost，编出内核依赖链和 llvm/mesa，
      # 产物进 .ccache；随后缓存步骤会把 .ccache 一起存进工具链缓存，
      # 固件构建恢复工具链时就能直接命中（llvm/mesa 是 -j1 构建，冷编很慢）。
      if: env.PANFROST == 'true'
      working-directory: ./openwrt
      env:
        CCACHE_MAXSIZE: 3G
      run: |
        cp .config /tmp/toolchain.full.config
        grep -E '^CONFIG_TARGET_' /tmp/toolchain.full.config > .config || true
        cat >> .config <<'EOF'
        CONFIG_CCACHE=y
        CONFIG_PACKAGE_libmesa-panfrost=y
        EOF
        make -s defconfig
        echo "mesa-only 配置："
        grep -E 'CONFIG_PACKAGE_(libmesa-panfrost|llvm)=' .config || true
        # 限时 3.5 小时（job 上限 330 分钟）；超时也保留已经编出来的 ccache
        timeout 12600 make -j$(nproc) world || true
        ccache -s || true

    - name: 保存工具链到 Actions 缓存
      uses: lunatickochiya/cachewrtbuild@save-on-failure
      with:
        ccache: 'true'
        toolchain: 'true'
        skip: 'true'
        mixkey: tc-${{ env.OpenWrt_PATCH_FILE_DIR }}${{ env.eBPF }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 上传工具链到 Release
      working-directory: ./openwrt
      env:
        GH_TOKEN: ${{ github.token }}
        # working-directory 是 /workdir/openwrt（源码仓库），不指定的话 gh 会把
        # origin 当成 openwrt-ipq-2410（私有）→ 404；这里显式指向当前仓库。
        GH_REPO: ${{ github.repository }}
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
        TC_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain)
        TC_SUFFIX="${eBPF:-}"
        ASSET="toolchain-${OpenWrt_PATCH_FILE_DIR}${TC_SUFFIX}-${TC_HASH}.tar.zst"
        echo "toolchain hash: $TC_HASH"
        tar -cf - staging_dir/host* staging_dir/tool* | zstd -3 -T0 -q -o "/tmp/$ASSET"
        ls -lh "/tmp/$ASSET"
        gh release view toolchain-cache >/dev/null 2>&1 || \
          gh release create toolchain-cache --title "Toolchain cache" \
            --notes "RK-action 预编译工具链（build-toolchain-cache.yml 自动上传）"
        gh release upload toolchain-cache "/tmp/$ASSET" --clobber
        echo "上传完成：toolchain-cache / $ASSET"
